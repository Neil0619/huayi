<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>语见 · Seen &amp; Said</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body aria-busy="true">
    <header class="popup-header">
      <div class="popup-brand">
        <span class="brand-mark" data-brand-mark aria-hidden="true"></span>
        <div>
          <h1>语见</h1>
          <p class="analysis-summary" data-analysis-summary>
            <span data-provider>OpenAI</span>
            <span
              data-model-consent
              role="img"
              tabindex="0"
              aria-label="正在读取模型联网许可"
            ></span>
          </p>
        </div>
      </div>
      <div class="header-actions" aria-label="快捷操作">
        <label class="header-switch" title="在所有网站启用语见">
          <span class="visually-hidden">在所有网站启用语见</span>
          <input
            type="checkbox"
            role="switch"
            data-global-enabled
            aria-label="在所有网站启用语见"
            disabled
          />
        </label>
        <button
          class="icon-button"
          type="button"
          data-toggle-appearance
          aria-label="选择外观"
          aria-expanded="false"
          aria-controls="popup-appearance"
          title="选择外观"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M12 3a9 9 0 1 0 9 9c0-1.1-.9-2-2-2h-1.2a2.8 2.8 0 0 1-2.8-2.8V5c0-1.1-.9-2-2-2Z"
            />
            <circle cx="7.5" cy="11" r="1" />
            <circle cx="10" cy="7.5" r="1" />
            <circle cx="8.5" cy="15" r="1" />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          data-open-options
          aria-label="打开设置"
          title="打开设置"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" />
            <path
              d="m19.4 15 .1.1a2 2 0 0 1-2.8 2.8l-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8v.2a2 2 0 0 1-4 0v-.2A2 2 0 0 0 8 17.4a2 2 0 0 0-2.2.4l-.1.1a2 2 0 1 1-2.8-2.8L3 15a2 2 0 0 0 .4-2.2A2 2 0 0 0 1.6 12h-.2a2 2 0 0 1 0-4h.2a2 2 0 0 0 1.8-1.2A2 2 0 0 0 3 4.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A2 2 0 0 0 8 2.2 2 2 0 0 0 9.2.4V.4a2 2 0 0 1 4 0v.2a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a2 2 0 0 0-.4 2.2 2 2 0 0 0 1.8 1.2h.2a2 2 0 0 1 0 4h-.2A2 2 0 0 0 19 13a2 2 0 0 0 .4 2Z"
            />
          </svg>
        </button>
      </div>
    </header>
    <div
      class="popup-appearance"
      id="popup-appearance"
      data-popup-appearance
      role="group"
      aria-label="外观主题"
      hidden
    >
      <button type="button" data-popup-theme="moon" aria-pressed="false">去青月白</button>
      <button type="button" data-popup-theme="silver" aria-pressed="true">流银镜白</button>
      <button type="button" data-popup-theme="champagne" aria-pressed="false">香槟晨霜</button>
      <button type="button" data-popup-theme="porcelain" aria-pressed="false">霁蓝瓷光</button>
    </div>
    <p
      class="status"
      data-popup-status
      data-tone="neutral"
      role="status"
      aria-live="polite"
      tabindex="-1"
    ></p>
    <main>
      <section aria-labelledby="site-title">
        <div class="site-copy">
          <span class="section-label" id="site-title">当前网站</span>
          <strong data-site-host>正在读取当前页面…</strong>
        </div>
        <label class="toggle-row">
          <span>在此网站启用</span>
          <input
            type="checkbox"
            role="switch"
            data-site-enabled
            aria-label="在当前网站启用语见"
            disabled
          />
        </label>
      </section>
      <section class="cloud-card" aria-label="账号连接">
        <div class="cloud-row">
          <span data-cloud-session-state role="status">正在读取账号…</span>
          <button class="text-button" type="button" data-cloud-session-action disabled>连接</button>
        </div>
      </section>
      <section class="outbox-row" aria-labelledby="outbox-title" hidden>
        <div class="site-copy outbox-copy">
          <span class="section-label" id="outbox-title">待上传</span>
          <strong data-submission-outbox-state role="status" aria-live="polite" tabindex="-1">
            正在读取待提交状态…
          </strong>
        </div>
        <div class="outbox-actions" aria-label="待上传内容操作">
          <button class="text-button" type="button" data-submission-outbox-retry disabled>
            重试
          </button>
          <button
            class="text-button danger-button"
            type="button"
            data-submission-outbox-clear
            disabled
          >
            清空
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
