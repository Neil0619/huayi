packages:
  - "apps/*"
  - "packages/*"

# Taro 4.2.1 pins vulnerable Swiper 11; keep the override on that consumer.
# Patch vulnerable dependency lines without replacing other major versions.
overrides:
  "@tarojs/components@4.2.1>swiper": "12.1.2"
  "brace-expansion@>=1.0.0 <1.1.18": "1.1.18"
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.9"
  "nanoid@>=3.0.0 <3.3.18": "3.3.18"
  "postcss@>=8.0.0 <8.5.28": "8.5.28"
  "qs@>=6.0.0 <6.16.0": "6.16.0"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "glob@>=10.0.0 <10.5.0": "10.5.0"
  "@tarojs/cli@4.2.1>adm-zip": "0.6.1"
  "esbuild@>=0.21.0 <0.22.0": "0.25.12"
  "serialize-javascript@>=6.0.0 <7.0.5": "7.1.1"
  "sockjs@0.3.24>uuid": "11.1.1"
  "webpack-dev-server@>=4.0.0 <5.2.6": "5.2.6"
  "download-git-repo@3.0.2>download": "-"
  "download-git-repo@3.0.2>git-clone": "-"
  "download-git-repo@3.0.2>rimraf": "-"
  "@tarojs/cli@4.2.1>latest-version": "9.0.0"
  "@tarojs/webpack5-runner@4.2.1>html-minifier": "-"
  "miniprogram-simulate@1.6.2>postcss": "8.5.28"
  "miniprogram-simulate@1.6.2>less": "4.9.1"

# Runtime replacements are added at the consumer; the patches preserve the existing API.
packageExtensions:
  "download-git-repo@3.0.2":
    dependencies:
      "@xhmikosr/decompress": "11.1.3"
  "@tarojs/webpack5-runner@4.2.1":
    dependencies:
      "html-minifier-terser": "7.2.0"

patchedDependencies:
  "download-git-repo@3.0.2": patches/taro-download-git-repo-3.0.2.patch
  "@tarojs/cli@4.2.1": patches/taro-cli-latest-version-4.2.1.patch
  "@tarojs/webpack5-runner@4.2.1": patches/taro-webpack5-runner-4.2.1.patch
  "miniprogram-simulate@1.6.2": patches/taro-miniprogram-simulate-1.6.2.patch
