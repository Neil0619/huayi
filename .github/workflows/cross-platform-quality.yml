name: Asbplayer offline diagnostics
run-name: Asbplayer offline diagnostics / ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact diagnostic candidate commit SHA
        required: true
        type: string
      release_id:
        description: Diagnostic invocation label; never release evidence
        required: true
        type: string

permissions:
  contents: read

jobs:
  targeted-diagnostics:
    uses: ./.github/workflows/asbplayer-diagnostics.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
