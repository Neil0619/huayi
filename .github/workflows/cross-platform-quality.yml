name: Cross-platform quality
run-name: Cross-platform quality / ${{ inputs.release_id || github.ref_name }} / ${{ inputs.candidate_sha || github.sha }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA
        required: true
        type: string
      release_id:
        description: Stable hosted release identity
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cross-platform-quality-${{ github.workflow }}-${{ inputs.release_id || github.ref }}-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  macos-quality:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Verify exact candidate
        env:
          HUAYI_CI_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          HUAYI_CI_RELEASE_ID: ${{ inputs.release_id || 'automatic' }}
        run: node scripts/assert-ci-candidate.mjs
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome for Playwright
        run: pnpm exec playwright install chrome
      - run: pnpm verify:macos

  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Verify exact candidate
        env:
          HUAYI_CI_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          HUAYI_CI_RELEASE_ID: ${{ inputs.release_id || 'automatic' }}
        run: node scripts/assert-ci-candidate.mjs
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome for Playwright
        run: pnpm exec playwright install chrome
      - run: pnpm verify:windows
      - name: Upload Windows visual screenshot diffs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-visual-screenshot-diffs
          path: |
            **/lexical-translation-actual.png
            **/lexical-translation-diff.png
            **/lexical-explanation-actual.png
            **/lexical-explanation-diff.png
            **/practice-silver-desktop-actual.png
            **/practice-silver-desktop-diff.png
            **/practice-silver-mobile-actual.png
            **/practice-silver-mobile-diff.png
            **/store-silver-pearl-action-actual.png
            **/store-silver-pearl-action-diff.png
            **/store-silver-parchment-action-actual.png
            **/store-silver-parchment-action-diff.png
          if-no-files-found: ignore
          retention-days: 1
