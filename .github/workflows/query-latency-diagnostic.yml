name: Query latency diagnosis
run-name: Query latency diagnosis / ${{ inputs.candidate_sha || github.sha }}

on:
  push:
    branches: [codex/asbplayer-windows-validation-fixes]
    paths:
      - .github/workflows/query-latency-diagnostic.yml
      - apps/store-extension/src/content/overlay/**
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA to diagnose
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos-query-latency:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Verify exact candidate
        env:
          HUAYI_CI_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          HUAYI_CI_RELEASE_ID: automatic
        run: node scripts/assert-ci-candidate.mjs
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the protocol package used by Classic E2E fixtures
        run: pnpm --filter @huayi/protocol build
      - name: Install offline browser test dependencies
        run: |
          pnpm exec playwright install chrome
          pnpm exec playwright install chromium
      - name: Diagnose popup readiness without changing original assertions or retries
        env:
          HUAYI_QUERY_TIMING_DIAGNOSTICS: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/query-latency-diagnosis/results.json
        run: pnpm exec playwright test apps/store-extension/e2e/query-interaction.spec.ts --grep "makes popup" --repeat-each=20 --retries=0 --reporter=list,json
      - name: Preserve timing evidence and failure traces
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-query-latency-diagnosis
          path: |
            artifacts/query-latency-diagnosis/**
            artifacts/query-learning-refinement-20260905/**
            test-results/**
          retention-days: 14
